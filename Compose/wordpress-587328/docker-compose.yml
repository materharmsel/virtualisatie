# Week 5 - Docker Compose: webapplicatie van meerdere containers (WordPress + MySQL + phpMyAdmin)

services:
  db:
    image: mysql:8.0
    container_name: db-587328
    environment:
      MYSQL_ROOT_PASSWORD: root-587328
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress-587328
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - net-587328

  wordpress:
    image: wordpress:latest
    container_name: wordpress-587328
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-587328
      WORDPRESS_DB_NAME: wordpress
    networks:
      - net-587328

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin-587328
    depends_on:
      - db
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
    networks:
      - net-587328

volumes:
  db_data:

networks:
  net-587328:
