# Maarten ter Harmsel
# Studentnummer: 587328
# Week 6 - Webapplicatie in meerdere Pods (Deployment -> ReplicaSet -> Pods) + Service

apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-587328
  labels:
    app: webapp-587328
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp-587328
  template:
    metadata:
      labels:
        app: webapp-587328
    spec:
      containers:
        - name: webapp
          image: webapp-587328:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-svc-587328
  labels:
    app: webapp-587328
spec:
  type: NodePort
  selector:
    app: webapp-587328
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
