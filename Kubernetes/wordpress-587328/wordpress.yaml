# Week 6 - WordPress met persistente storage (PVC wordpress-pvc-587328) + Service

apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-587328
  labels:
    app: wordpress-587328
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wordpress-587328
  template:
    metadata:
      labels:
        app: wordpress-587328
    spec:
      containers:
        - name: wordpress
          image: wordpress:6.8-apache
          env:
            - name: WORDPRESS_DB_HOST
              value: mysql-svc-587328
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_PASSWORD
              value: wordpress-587328
            - name: WORDPRESS_DB_NAME
              value: wordpress
            # minikube service kiest elke keer een andere poort.
            # Daarom gebruikt WordPress het adres waarmee je hem opent.
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', 'http://' . $_SERVER['HTTP_HOST']);
                define('WP_SITEURL', 'http://' . $_SERVER['HTTP_HOST']);
          ports:
            - containerPort: 80
          volumeMounts:
            - name: wordpress-storage
              mountPath: /var/www/html
      volumes:
        - name: wordpress-storage
          persistentVolumeClaim:
            claimName: wordpress-pvc-587328
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-svc-587328
spec:
  type: NodePort
  selector:
    app: wordpress-587328
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
