# Week 6 - MySQL-database met persistente storage (PVC mysql-pvc-587328)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-587328
  labels:
    app: mysql-587328
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql-587328
  template:
    metadata:
      labels:
        app: mysql-587328
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root-587328
            - name: MYSQL_DATABASE
              value: wordpress
            - name: MYSQL_USER
              value: wordpress
            - name: MYSQL_PASSWORD
              value: wordpress-587328
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc-587328
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-svc-587328
spec:
  type: ClusterIP
  selector:
    app: mysql-587328
  ports:
    - port: 3306
      targetPort: 3306
